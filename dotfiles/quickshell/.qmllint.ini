[General]
DisableDefaultImports=false

[Warnings]
# Disables warnings for idiomatic dynamic QML scoping (e.g. parent, modelData, outer IDs)
UnqualifiedAccess=disable
# Disables warnings for JS 'var' hoisted in blocks
BlockScopeVarDeclaration=disable
# Disables warnings for Quickshell types like PanelWindow
UncreatableType=disable
# Disables verbose layout positioning suggestions (anchors in Layouts)
Quick.LayoutsPositioning=disable
# Disables legacy PropertyChanges binding syntax warnings
Quick.PropertyChangesParsed=disable

